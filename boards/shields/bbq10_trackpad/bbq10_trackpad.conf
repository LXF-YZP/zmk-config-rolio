# Trackpad: ADBS-A320 on I2C, read by custom_driver/a320.c
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Trackpad backlight on P1.13, driven by custom_driver/trackpad_led.c
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# a320.c and trackpad_led.c follow the host Caps Lock state
CONFIG_ZMK_HID_INDICATORS=y
