# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property.
---
include:
  - board: seeeduino_xiao_ble
    shield: q20
  # 调试固件：通过 USB 串口输出日志，用来确认 A320 的 I2C 通信是否正常。
  # 触控板问题排查完后可以删掉这一项。
  - board: seeeduino_xiao_ble
    shield: q20
    # 日志延迟 10 秒输出、缓冲区满时丢弃新消息，保证能看到开机日志（如背光初始化），
    # 不会被触控板主循环的鼠标日志冲掉。
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y -DCONFIG_SENSOR_LOG_LEVEL_DBG=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=10000 -DCONFIG_LOG_MODE_OVERFLOW=n -DCONFIG_LOG_BUFFER_SIZE=8192
    artifact-name: q20-seeeduino_xiao_ble-debug
