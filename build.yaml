# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property.
---
include:
  - board: nice_nano_v2
    shield: q20
  # 调试固件：通过 USB 串口输出日志，用来确认 A320 的 I2C 通信是否正常。
  # 触控板问题排查完后可以删掉这一项。
  - board: nice_nano_v2
    shield: q20
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y -DCONFIG_SENSOR_LOG_LEVEL_DBG=y
    artifact-name: q20-nice_nano_v2-debug
