# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: bbq10_trackpad
    artifact-name: nice_nano_v2_bbq10_trackpad
  # Same firmware with logs over the USB serial port, for troubleshooting.
  - board: nice_nano_v2
    shield: bbq10_trackpad
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000
    artifact-name: nice_nano_v2_bbq10_trackpad_usb_logging
  - board: nice_nano_v2
    shield: settings_reset
