# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # The board dts already provides the ZMK Studio CDC-ACM UART, so do not add
  # the studio-rpc-usb-uart snippet here.
  - board: zitaotech_q10
    artifact-name: bbq10_pro_default_firmware
  - board: zitaotech_q10
    shield: settings_reset
    artifact-name: bbq10_pro_reset_firmware
