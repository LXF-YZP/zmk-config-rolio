CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Both E73 halves sense the raw LiPo voltage through the P0.04/AIN2 divider.
CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_VOLTAGE_DIVIDER=y
# The central must hold one host link and one right-half split link.
CONFIG_BT_MAX_CONN=2
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="Sofle_RGB"
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
