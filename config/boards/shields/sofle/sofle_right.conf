CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_SSD1306=n
# Keep the sensor powered while the right half is operating. The PAW3395
# driver does not provide a suspend/resume path for ZMK deep sleep.
CONFIG_ZMK_SLEEP=n
CONFIG_PAW3395=y
# Some PAW3395 boards need more than the driver's 50 ms minimum power-up
# delay before the SROM initialization sequence can be read reliably.
CONFIG_PAW3395_INIT_POWER_UP_EXTRA_DELAY_MS=3000
CONFIG_PAW3395_REPORT_INTERVAL_MIN=12
