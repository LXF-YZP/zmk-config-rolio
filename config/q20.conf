# I2C + sensor stack for the A320 trackpad
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_I2C_NRFX=y
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=n

# Avago ADBS-A320 (BlackBerry Q20 trackpad) driver
CONFIG_INPUT_A320=y
CONFIG_INPUT_A320_POLLINGRATE=100

# Mouse emulation (trackpad acts as mouse)
CONFIG_ZMK_MOUSE=y

# Required by fork's main.c trackpad branch (zmk_hid_indicators_get_current_profile)
CONFIG_ZMK_HID_INDICATORS=y

# Trackpad scrolling / speed tuning
CONFIG_TRACKPAD_SCROLL_INTERVAL=20
CONFIG_TRACKPAD_SPEEDMULTIPLIER_HORIZONTAL=100
CONFIG_TRACKPAD_SPEEDMULTIPLIER_VERTICAL=100

# Trackpad backlight (TPBLK on P1.13 drives Q2)
CONFIG_PWM=y
CONFIG_LED_PWM=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
