# The left half remains the split central and directly drives the Prospector
# ST7789 display using the E73 Sofle LCD pin assignment.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
# Keep battery-powered display current reasonable and reduce brown-out risk.
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50
CONFIG_LV_Z_VDB_SIZE=25

# Keep the Prospector display on even when the keyboard is idle. Disabling
# deep sleep is also required because the display cannot stay on while the
# left half is powered down.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_SLEEP=n

# Use the Operator status screen shown in Prospector's new-status-screens branch.
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
CONFIG_PROSPECTOR_MODIFIER_OS_GENERIC=y
CONFIG_PROSPECTOR_MODIFIER_ORDER="SCAG"

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
