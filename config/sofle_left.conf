CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_SPI=y
# The ADS1220 driver initializes at POST_KERNEL priority 6.  The SPI bus
# must be ready first so Zephyr's init-priority dependency check passes.
CONFIG_SPI_INIT_PRIORITY=5
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_INPUT=y
CONFIG_INPUT_ANALOG_AXIS_HIRES=y
CONFIG_INPUT_ANALOG_AXIS_HIRES_SETTINGS=y
CONFIG_MULTITHREADING=y
