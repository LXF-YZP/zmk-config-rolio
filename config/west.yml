manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    # zitaotech_q10 uses the Zephyr 3.5 board layout (HWMv1). ZMK main has
    # moved to Zephyr 4.1, so keep this pinned to a v0.3 release.
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
  self:
    path: config
