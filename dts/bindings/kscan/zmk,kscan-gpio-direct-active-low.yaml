description: Direct GPIO KSCAN controller with active-low input support

compatible: "zmk,kscan-gpio-direct-active-low"

include: kscan.yaml

properties:
  input-gpios:
    type: phandle-array
    required: true
  debounce-press-ms:
    type: int
    default: 5
  debounce-release-ms:
    type: int
    default: 5
  poll-period-ms:
    type: int
    default: 5
